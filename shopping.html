<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Compra - Casa Mocholí Chordà</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
</head>

<body>
    <div class="main-container">

        <div class="back-button">
            <button onclick="window.location.href='index.html'" class="btn btn-secondary">
                ← Volver
            </button>
        </div>

        <header class="home-header" style="margin-bottom: 1.5rem;">
            <h2>🛒 Lista de la Compra</h2>
            <p id="shopping-summary-text" style="color: var(--text-muted);">¿Qué falta en casa?</p>
        </header>

        <!-- Category Filters -->
        <div class="filter-pills" id="shopping-filter-pills">
            <button class="filter-pill active" data-cat="all">Todas</button>
            <button class="filter-pill" data-cat="supermarket">🛒 Super</button>
            <button class="filter-pill" data-cat="fresh">🍎 Frescos</button>
            <button class="filter-pill" data-cat="health">💊 Farmacia</button>
            <button class="filter-pill" data-cat="home">🏠 Hogar</button>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
                <input type="text" id="item-input" class="form-input" placeholder="Ej: Leche, Huevos, Manzanas..." style="flex: 2; min-width: 160px;">
                <select id="item-category" class="form-select" style="flex: 1; min-width: 120px;">
                    <option value="supermarket">🛒 Super</option>
                    <option value="fresh">🍎 Frescos</option>
                    <option value="health">💊 Farmacia</option>
                    <option value="home">🏠 Hogar</option>
                    <option value="other">📦 Otros</option>
                </select>
                <button id="add-item-btn" class="btn btn-primary" style="padding: 0 1.25rem;">+ Añadir</button>
            </div>

            <div id="shopping-list" style="border: 1px solid var(--btn-secondary-border, #E5E7EB); border-radius: var(--radius-md); overflow: hidden; min-height: 100px;">
                <!-- Items go here -->
            </div>

            <div style="margin-top: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                <button id="share-whatsapp-btn" class="btn btn-sm btn-whatsapp">
                    📲 Enviar por WhatsApp
                </button>
                <button id="clear-completed-btn" class="btn btn-sm btn-secondary">
                    🗑 Limpiar comprados
                </button>
            </div>
        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/sync-service.js"></script>
    <script src="js/main.js"></script>
    <script src="js/shopping.js"></script>
</body>

</html>
