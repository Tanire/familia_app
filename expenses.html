<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Mensuales - Casa Mocholí Chordà</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
</head>

<body>
    <div class="main-container">

        <div class="back-button">
            <button onclick="window.location.href='index.html'" class="btn btn-secondary">
                ← Volver
            </button>
        </div>

        <header class="home-header">
            <h2>💶 Gastos e Ingresos</h2>

            <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1rem;">
                <button id="prev-month-stats" class="arrow-btn btn btn-secondary">←</button>
                <div id="stats-month-year" style="font-weight: 700; font-size: 1.1rem;"></div>
                <button id="next-month-stats" class="arrow-btn btn btn-secondary">→</button>
            </div>

            <div id="balance-container" class="balance-card">
                <div class="balance-row">
                    <div class="balance-item income">
                        <small>Ingresos</small>
                        <span id="total-income">0.00 €</span>
                    </div>
                    <div class="balance-item expense">
                        <small>Gastos</small>
                        <span id="total-expense">0.00 €</span>
                    </div>
                </div>
                <div class="balance-total" style="flex: 1; border-left: 1px solid var(--btn-secondary-border, #E5E7EB); padding-left: 1rem;">
                    <small>Balance</small>
                    <span id="total-balance">0.00 €</span>
                </div>
            </div>
            
            <div id="budget-container" style="background: var(--bg-card); padding: 1rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--btn-secondary-border, #E5E7EB); display: none; margin-bottom: 1rem; text-align: left;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px;">
                    <strong style="color: var(--text-muted);">Presupuesto Mensual</strong>
                    <span id="budget-text" style="font-weight: 700;">0 / 1000 €</span>
                </div>
                <div style="width: 100%; height: 10px; background: var(--bg-body); border-radius: 5px; overflow: hidden; border: 1px solid var(--btn-secondary-border, #E5E7EB);">
                    <div id="budget-bar" style="height: 100%; width: 0%; background: var(--secondary); transition: width 0.4s ease, background-color 0.4s ease;"></div>
                </div>
            </div>

            <!-- Person Breakdown Card -->
            <div id="person-breakdown-card" class="card" style="margin-bottom: 1.25rem; padding: 1rem; border-radius: var(--radius-lg); text-align: left; background: var(--bg-card); border: 1px solid var(--btn-secondary-border, #E5E7EB);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                    <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-main); display: flex; align-items: center; gap: 0.4rem;">
                        <span>👥</span> Gastos por Persona
                    </div>
                    <span id="active-person-filter-badge" style="display: none; background: var(--primary); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer;" title="Quitar filtro de persona">
                        Filtrado: <span id="active-person-filter-name"></span> ✕
                    </span>
                </div>
                <div id="person-stats-list" style="display: flex; flex-direction: column; gap: 0.6rem;">
                    <!-- Dynamically populated by JS -->
                </div>
            </div>
        </header>

        <!-- New Expense Form -->
        <div class="card add-expense-form">
            <h3>Añadir Movimiento</h3>

            <button id="scan-btn" class="btn btn-secondary"
                style="width: 100%; margin-bottom: 1rem; border: 1px dashed var(--primary); color: var(--primary);">
                📸 Escanear Ticket (OCR)
            </button>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            <div id="scan-status" class="hidden"
                style="text-align: center; font-size: 0.85rem; margin-bottom: 1rem; color: var(--text-muted);">
                Procesando imagen... <span id="scan-progress">0%</span>
            </div>

            <div class="form-group">
                <select id="expense-type" class="form-input" style="font-weight: 600;">
                    <option value="expense">📉 Gasto</option>
                    <option value="income">📈 Ingreso</option>
                </select>
            </div>

            <div class="form-group">
                <input type="text" id="expense-title" class="form-input" placeholder="Concepto (ej: Mercadona, Luz, Gasolina...)">
            </div>

            <div class="form-group">
                <label class="form-label">Fecha del Movimiento</label>
                <input type="date" id="expense-date" class="form-input">
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:1">
                    <label class="form-label">Importe (€)</label>
                    <input type="number" id="expense-amount" class="form-input" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group" style="flex:1">
                    <label class="form-label">Categoría</label>
                    <select id="expense-category" class="form-input">
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">¿Quién ha pagado? (Persona)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <select id="expense-paid-by" class="form-input" style="flex: 1; font-weight: 600;">
                        <!-- Populated dynamically -->
                    </select>
                    <button type="button" id="btn-add-person-quick" class="btn btn-secondary" style="padding: 0 0.85rem; white-space: nowrap;" title="Añadir nueva persona">+ Persona</button>
                </div>
            </div>

            <!-- Recurring Options -->
            <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="is-recurring" style="width: auto; margin: 0; cursor: pointer;">
                <label for="is-recurring" style="font-size: 0.9rem; user-select: none; cursor: pointer;">Es un Gasto Fijo (Mensual recurrente)</label>
            </div>

            <div id="recurring-options" class="hidden"
                style="margin-top: 0.5rem; background: var(--bg-body); padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--btn-secondary-border, #E5E7EB);">
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="font-size: 0.85rem;">Día de cargo mensual (1-31):</label>
                    <input type="number" id="recurring-day" class="form-input" min="1" max="31" placeholder="Ej: 5">
                </div>
            </div>

            <button id="add-expense-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                + Guardar Movimiento
            </button>
        </div>

        <!-- Toggle View -->
        <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap;">
            <button id="view-expenses-btn" class="btn btn-sm btn-primary">Historial Mes</button>
            <button id="view-recurring-btn" class="btn btn-sm btn-secondary">Ver Fijos</button>
            <button id="view-charts-btn" class="btn btn-sm btn-secondary">📊 Gráficos</button>
        </div>

        <!-- Category filter in expenses history -->
        <div id="expense-filters-container" class="filter-pills" style="margin-bottom: 0.75rem;">
            <!-- Category filter pills generated dynamically -->
        </div>

        <div id="expenses-list" class="expense-list">
            <!-- Generated by JS -->
        </div>

        <div id="recurring-list" class="expense-list hidden">
            <!-- Generated by JS -->
        </div>

        <div id="charts-view" class="hidden" style="margin-top: 1rem;">
            <div class="card" style="margin-bottom: 2rem;">
                <h3 style="text-align: center; margin-bottom: 1rem;">👥 Gastos por Persona</h3>
                <div style="height: 300px; position: relative;">
                    <canvas id="personChart"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom: 2rem;">
                <h3 style="text-align: center; margin-bottom: 1rem;">Gastos por Categoría</h3>
                <div style="height: 300px; position: relative;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3 style="text-align: center; margin-bottom: 1rem;">Evolución Mensual (Últimos 6 meses)</h3>
                <div style="height: 300px; position: relative;">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Share monthly summary button -->
        <div style="margin-top: 1.5rem; text-align: center;">
            <button id="share-monthly-whatsapp-btn" class="btn btn-sm btn-whatsapp">
                📲 Compartir Resumen del Mes por WhatsApp
            </button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="js/storage.js"></script>
    <script src="js/sync-service.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/ocr-service.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
